name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - safari-desktop
          - mobile-safari
          - android-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          CI: 'true'
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
          TEST_CARD_EXPIRY_MONTH: ${{ secrets.TEST_CARD_EXPIRY_MONTH }}
          TEST_CARD_EXPIRY_YEAR: ${{ secrets.TEST_CARD_EXPIRY_YEAR }}
          TEST_CARD_CVV: ${{ secrets.TEST_CARD_CVV }}
          PAYPAL_SANDBOX_EMAIL: ${{ secrets.PAYPAL_SANDBOX_EMAIL }}
          PAYPAL_SANDBOX_PASSWORD: ${{ secrets.PAYPAL_SANDBOX_PASSWORD }}
          AFTERPAY_SANDBOX_EMAIL: ${{ secrets.AFTERPAY_SANDBOX_EMAIL }}
          AFTERPAY_SANDBOX_PASSWORD: ${{ secrets.AFTERPAY_SANDBOX_PASSWORD }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
